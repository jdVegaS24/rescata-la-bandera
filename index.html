<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rescata la bandera</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body{margin:0}img{max-width:100%}

/* Layout: una sola columna de 640px; portada con 5 retos y una vista por reto (#reto-1 a #reto-5). */
:root{
  --bg:#f5f8ff; --surface:#ffffff; --fg:#10163f; --muted:#5a6086; --line:#cfd8ee;
  --accent:#e23a62; --accent-fg:#ffffff; --warm:#ff8825; --soft:#e8f0ff; --code:#eef2fb;
  --font-d:'Poppins',system-ui,sans-serif; --font-m:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1030; --surface:#141b4a; --fg:#eef1ff; --muted:#a6add2; --line:#2a3369;
  --accent:#ff6b8e; --accent-fg:#10163f; --warm:#ffa14d; --soft:#1b2459; --code:#0e1440; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1030; --surface:#141b4a; --fg:#eef1ff; --muted:#a6add2; --line:#2a3369;
  --accent:#ff6b8e; --accent-fg:#10163f; --warm:#ffa14d; --soft:#1b2459; --code:#0e1440; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font-d);font-size:16px;line-height:1.55;
  padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(28px,7vw,38px);line-height:1.12;font-weight:700;text-wrap:balance}
h2{font-size:clamp(22px,5.5vw,28px);line-height:1.2;font-weight:700;text-wrap:balance}
.eyebrow{font-family:var(--font-m);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted)}
.tiles{display:grid;gap:12px;padding:0;margin:0;list-style:none}
.tile{display:grid;grid-template-columns:48px 1fr;gap:4px 14px;align-items:center;padding:14px 16px;background:var(--surface);
  border:1.5px solid var(--line);border-radius:14px;color:inherit;text-decoration:none}
.tile:hover,.tile:focus-visible{border-color:var(--accent);outline:none}
.num{grid-row:span 2;width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;font-size:20px}
.tile b{font-weight:600}.tile span.t{color:var(--muted);font-size:14px}
.box{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.box.warm{background:var(--soft);border-color:var(--warm)}
code,.mono{font-family:var(--font-m);font-size:14px;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:2px 8px;overflow-wrap:anywhere}
.mono{display:block;padding:12px;font-size:13px;word-break:break-all;user-select:all}
ol.tasks{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.btn{display:inline-block;background:var(--accent);color:var(--accent-fg);font-weight:600;padding:12px 18px;border-radius:12px;text-decoration:none;text-align:center}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn:focus-visible,.back:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.back{color:var(--muted);font-size:14px;text-decoration:none}
.tag{align-self:flex-start;font-family:var(--font-m);font-size:12px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}
.rule{font-size:14px;color:var(--muted)}
.dom{display:flex;gap:12px;align-items:flex-start}.dom b{min-width:22px}
</style>

</head><body>
<main id="app"></main>

<script>
var FORM="https://docs.google.com/forms/d/e/1FAIpQLSci5XgX0PVCWcFIryjyjdz9B4x0_Z8x8oA76n5Apnm8dX2AGw/viewform";
var R=[
 {t:"Conceptos: la tríada CIA",tag:"Conceptos",
  body:'<div class="box"><p><b>Caso.</b> Alguien entra al sistema de la universidad y publica las notas de todos los estudiantes.</p></div>'+
  '<ol class="tasks"><li>¿Cuál es el <b>activo</b> y cuál la <b>amenaza</b>? <i class="rule">Anótalo; no se entrega.</i></li><li>¿Qué pilar de la tríada CIA se violó? <b>Esta es tu clave.</b></li></ol>',
  clave:"Escribe el nombre del pilar violado, en mayúsculas y sin tildes."},
 {t:"Malware: ¿qué es?",tag:"Amenazas",
  body:'<div class="box"><p><b>Caso.</b> Una persona instala un juego desde un enlace que le enviaron. Al abrirlo, sus fotos y documentos quedan bloqueados y aparece un mensaje que pide un pago para devolverlos.</p></div>'+
  '<ol class="tasks"><li>¿Qué tipo de malware es? <b>Esta es tu clave.</b></li><li>Nombra una forma de haberlo evitado. <i class="rule">Anótalo; no se entrega.</i></li></ol>',
  clave:"Escribe el tipo de malware, en mayúsculas y sin guiones."},
 {t:"Phishing: lee el dominio",tag:"Ingeniería social",
  body:'<div class="box"><p>Estas tres direcciones dicen ser de USFQ. <b>No las abras ni las toques.</b> Están escritas como texto a propósito.</p>'+
  '<div class="dom"><b>1</b><span class="mono">https://www.usfq.edu.ec</span></div>'+
  '<div class="dom"><b>2</b><span class="mono">https://usfq-login-verificar.com</span></div>'+
  '<div class="dom"><b>3</b><span class="mono">https://wwww.usfq.edu.ec.cuenta-segura.net</span></div></div>'+
  '<ol class="tasks"><li>Copia cada dirección y pégala en la pestaña <b>URL</b> de VirusTotal o en el buscador de urlscan.io. Algunas pueden no tener resultados: es normal.</li>'+
  '<li>Lee el dominio real: es lo que queda justo antes de la primera barra y termina en la última parte.</li><li>Decide cuáles son falsas.</li></ol>'+
  '<div class="row"><a class="btn ghost" href="https://www.virustotal.com/gui/home/url" target="_blank" rel="noopener">Abrir VirusTotal</a><a class="btn ghost" href="https://urlscan.io/" target="_blank" rel="noopener">Abrir urlscan.io</a></div>',
  clave:"Escribe los números de las direcciones falsas, de menor a mayor y separados por guion. Ejemplo: 1-2."},
 {t:"Mensaje cifrado",tag:"Criptografía básica",
  body:'<div class="box"><p>Interceptaste este mensaje. Está codificado en Base64.</p>'+
  '<span class="mono" id="b64">QWN0aXZhIGxhIHZlcmlmaWNhY2lvbiBlbiBkb3MgcGFzb3MuIENMQVZFOiBFU0NVRE8=</span>'+
  '<div class="row"><button class="btn ghost" id="cp" type="button">Copiar mensaje</button></div></div>'+
  '<ol class="tasks"><li>Abre CyberChef con la receta <i>From Base64</i> ya cargada.</li><li>Pega el mensaje en <b>Input</b> y lee el resultado. <b>La palabra que aparece después de CLAVE: es tu clave.</b></li></ol>'+
  '<div class="row"><a class="btn ghost" href="https://gchq.github.io/CyberChef/#recipe=From_Base64(\'A-Za-z0-9%2B/%3D\',true,false)" target="_blank" rel="noopener">Abrir CyberChef</a></div>'+
  '<p class="rule">Pregunta para pensar: codificar no es cifrar. ¿Por qué cualquiera pudo leer el mensaje? <i>Anótalo; no se entrega.</i></p>',
  clave:"Tu clave es la palabra que quedó cifrada: aparece después de CLAVE: en el mensaje ya descifrado."},
 {t:"Ecuador: ¿qué ley aplica?",tag:"Ecuador",
  body:'<div class="box"><p><b>Caso.</b> Un estudiante adivina la contraseña del correo de un compañero, entra sin permiso y lee sus mensajes.</p></div>'+
  '<ol class="tasks"><li>¿Es un delito? ¿Qué se protege aquí? <i class="rule">Anótalo; no se entrega.</i></li><li>Busca en tus diapositivas qué código de Ecuador tipifica el acceso no consentido a un sistema informático. <b>Esta es tu clave.</b></li></ol>',
  clave:"Escribe la sigla del código, en mayúsculas."}
];
var app=document.getElementById('app');
function home(){
  var h='<p class="eyebrow">Seguridad de la información · Parte 1</p><h1>Rescata la bandera</h1>'+
  '<p class="lead">En parejas y con tu celular, resuelve los 5 retos. Cada uno te da una palabra clave. Al final las escribes todas en el formulario.</p><ul class="tiles">';
  R.forEach(function(r,i){h+='<li><a class="tile" href="#reto-'+(i+1)+'"><span class="num">'+(i+1)+'</span><b>'+r.t+'</b><span class="t">'+r.tag+'</span></a></li>';});
  h+='</ul><div class="box warm"><p><b>Reglas</b></p><p class="rule">No escribas contraseñas ni datos reales en ningún sitio. No abras enlaces sospechosos: solo se analizan. Trabaja solo con el material del reto.</p></div>'+
  '<a class="btn" href="'+FORM+'" target="_blank" rel="noopener">Ya tengo las 5 claves: ir al formulario</a>';
  app.innerHTML=h;
}
function reto(n){
  var r=R[n-1];
  var h='<a class="back" href="#">← Todos los retos</a><span class="tag">Reto '+n+' de 5 · '+r.tag+'</span><h2>'+r.t+'</h2>'+r.body+
  '<div class="box warm"><p><b>Tu clave</b></p><p>'+r.clave+'</p></div><div class="row">';
  if(n>1)h+='<a class="btn ghost" href="#reto-'+(n-1)+'">Reto anterior</a>';
  h+= n<5 ? '<a class="btn" href="#reto-'+(n+1)+'">Siguiente reto</a>' : '<a class="btn" href="'+FORM+'" target="_blank" rel="noopener">Ir al formulario</a>';
  h+='</div>';
  app.innerHTML=h;
  var cp=document.getElementById('cp');
  if(cp)cp.onclick=function(){var t=document.getElementById('b64').textContent;
    function sel(){var s=window.getSelection(),g=document.createRange();g.selectNodeContents(document.getElementById('b64'));s.removeAllRanges();s.addRange(g);cp.textContent='Selecciona y copia'}
    try{navigator.clipboard.writeText(t).then(function(){cp.textContent='Copiado'},sel)}catch(e){sel()}};
}
function route(){
  var m=/^#reto-([1-5])$/.exec(location.hash);
  if(m)reto(+m[1]);else home();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);route();
</script>

</body></html>
